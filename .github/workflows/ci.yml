name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: git diff --exit-code
